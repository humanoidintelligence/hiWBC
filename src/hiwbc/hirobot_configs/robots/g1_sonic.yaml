# SONIC on the free-standing MuJoCo G1 (hiRobot's `sim` extra, hiWBC's `onnx`
# extra, the SONIC checkpoints under ~/.cache/hiwbc/sonic).
defaults: [robots/unitree_g1_mujoco_standing]

assembly:
  parts:
    body:
      overrides:
        model:    # start in SONIC's standing pose (G1 SDK order)
          home: [-0.312, 0, 0, 0.669, -0.363, 0, -0.312, 0, 0, 0.669, -0.363, 0,
                 0, 0, 0, 0.2, 0.2, 0, 0.6, 0, 0, 0, 0.2, -0.2, 0, 0.6, 0, 0, 0]

sim:
  realtime: false
  ramp_seconds: 0.0

layers:
  - type: wbc
    profile: sonic/unitree_g1
    start_seconds: 0.0     # SONIC balances from the first tick
